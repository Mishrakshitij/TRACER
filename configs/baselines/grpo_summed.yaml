# Baseline: GRPO with summed rewards
phase: 1
model_name: "Qwen/Qwen2.5-3B-Instruct"
use_peft: true
datasets: ["gsm8k"]
epochs: 3
batch_size: 2
group_size: 4
learning_rate: 1e-5
loss_type: "grpo"
w_prm: 0.25
w_anchor: 0.20
w_corrigible: 0.20
w_ans: 0.25
w_len: 0.10
lambda_tcr: 0.0
lambda_sdpo: 0.0
num_turns: 3
benign_ratio: 0.15
output_dir: "outputs/baselines/grpo_summed"
seed: 42
