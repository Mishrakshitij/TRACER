# Phase 4: SDPO (self-distillation from rich feedback)
phase: 4
model_name: "Qwen/Qwen2.5-3B-Instruct"
quantization: null
use_peft: true

datasets:
  - gsm8k

epochs: 2
batch_size: 2
group_size: 4
gradient_accumulation_steps: 8
learning_rate: 5e-6

loss_type: "combined"
beta: 0.04
epsilon: 0.2
lambda_tcr: 0.1
lambda_sdpo: 0.1

output_dir: "outputs/r3af/phase4_sdpo"
seed: 42
