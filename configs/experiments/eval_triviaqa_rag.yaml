# Evaluate RAG-trained model on TriviaQA with RAG framing
# Tests cross-domain transfer: trained on GSM8K math, evaluated on trivia QA
model_name: "Qwen/Qwen2.5-3B-Instruct"
quantization: "4bit"
use_peft: true
lora_r: 64
lora_alpha: 128

datasets:
  - triviaqa

# RAG framing
attack_framing: "rag"

# Same attacks as RAG training
attack_families:
  - reasoning_rewrite
  - preemptive_answer
  - prompt_injection
attack_mix_weights:
  - 0.33
  - 0.33
  - 0.34
benign_ratio: 0.15
num_turns: 3

max_seq_length: 2048
max_new_tokens: 256
max_attack_tokens: 512

temperature: 0.7
top_p: 0.95

# Skip heavy models
prm_model_name: ""
nli_model_name: ""

output_dir: "outputs/r3af/eval_triviaqa_rag"
report_to: []
seed: 42
