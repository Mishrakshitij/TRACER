[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "r3af"
version = "0.1.0"
description = "TRACER: Trace-Regularized Training Against Indirect Prompt Injection"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate>=0.27",
    "peft>=0.10",
    "bitsandbytes",
    "datasets",
    "wandb",
    "pyyaml",
    "tqdm",
    "scipy",
    "RestrictedPython",
    "sympy",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["r3af*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
